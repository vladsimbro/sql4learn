name: SQL4Learn — validate and publish
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sql4learn-pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Validate JavaScript modules
        run: |
          for file in src/*.js tests/*.mjs; do node --check "$file"; done
      - name: Execute every reference query on two PostgreSQL datasets
        run: npm test
  deploy:
    needs: validate
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
  browser:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Check published site, SQL editor, progress and mobile
        env:
          BASE_URL: https://vladsimbro.github.io/sql4learn/
        run: npm run test:browser
